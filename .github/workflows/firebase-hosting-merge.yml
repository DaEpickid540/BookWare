# Deploy on merge to main.
#
# Firestore rules and indexes deploy FIRST, and the hosting deploy is gated on
# them succeeding. That order matters: shipping app code that depends on a new
# rule or a new index before those exist puts the live site into exactly the
# state this repo spent weeks in — code and rules disagreeing, with every
# resulting failure showing up as an unexplained "permission-denied" or
# "failed-precondition" in a user's console.
#
# Before this file did that at all, `action-hosting-deploy` shipped ONLY the
# contents of public/. firestore.rules and firestore.indexes.json were tracked,
# reviewed, and edited in this repo but never actually deployed by anything, so
# production ran whatever ruleset was last pushed by hand from someone's laptop.

name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main

jobs:
  firestore:
    name: Firestore rules & indexes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Firebase CLI authenticates with the same service-account secret the
      # hosting action uses. It needs the Firebase Rules Admin and Cloud
      # Datastore Index Admin roles — if this step fails with a permissions
      # error, that is what to grant it in the Google Cloud console.
      - name: Write service account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCHOOL_SUITE_652D8 }}
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy rules and indexes
        working-directory: ./mysite
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: >
          npx --yes firebase-tools@13 deploy
          --only firestore:rules,firestore:indexes
          --project school-suite-652d8
          --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"

  hosting:
    name: Hosting
    needs: firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "static site - no build step"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCHOOL_SUITE_652D8 }}
          channelId: live
          projectId: school-suite-652d8
          entryPoint: ./mysite
          target: bookware
