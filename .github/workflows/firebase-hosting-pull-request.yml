# Pull-request checks + hosting preview.
#
# The `rules` job compiles firestore.rules in the Firestore emulator. A rules
# file with a syntax error deploys as a hard failure and a rules file with a
# logic error deploys silently — either way the first symptom is a live user
# seeing "permission-denied", so at minimum the syntax gets checked here rather
# than on main.

name: Checks & preview on PR
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  rules:
    name: Firestore rules compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The Firestore emulator's launcher refuses anything below 21 on
          # current firebase-tools. Running it locally needs the same JDK.
          java-version: '21'

      - name: Validate firestore.indexes.json
        run: node -e "JSON.parse(require('fs').readFileSync('mysite/firestore.indexes.json','utf8')); console.log('indexes file parses')"

      # emulators:exec loads and compiles the ruleset before running the
      # command; a malformed rules file fails the job here.
      - name: Compile rules in the emulator
        working-directory: ./mysite
        run: >
          npx --yes firebase-tools@13 emulators:exec
          --only firestore
          --project school-suite-652d8
          "echo rules compiled ok"

  preview:
    name: Hosting preview
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "static site - no build step"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCHOOL_SUITE_652D8 }}
          projectId: school-suite-652d8
          entryPoint: ./mysite
          target: bookware
